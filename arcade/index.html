<!DOCTYPE html>
<html lang="en">
<head>

<!-- Mutagen Arcade. Plain HTML + JS, no build step, works offline from file:// and on GitHub Pages.
     mutagen_rules.js is generated from builder/index.html (node tools/sync_arcade.js); roster.js from the encounter
     roster (python3 tools/export_arcade_roster.py). engine.js holds the rules; app.js is this page. -->
<style>
:root{--bg:#0d1110;--pan:#161c1a;--pan2:#1e2623;--ink:#dfe8e2;--dim:#8fa39a;--acid:#b6ff2e;--acid2:#4cc300;--chrome:#62d7ff;--bio:#8cff6a;--splice:#ff5fd2;--bad:#ff5a5a;--warn:#ffc23d;--line:#2c3833;--foe:#ff8a5a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acid)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#0d1110 0%,rgba(13,17,16,.92) 60%,rgba(13,17,16,.75)),url(../art/cover.jpg) center/cover;border-bottom:2px solid var(--acid2);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
header h1{margin:0 12px 0 0;font-size:22px;letter-spacing:4px;color:var(--acid);text-shadow:0 0 8px rgba(182,255,46,.5)}
header h1 small{font-size:11px;letter-spacing:1px;color:var(--dim);display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer;min-height:36px}button:hover:not(:disabled){border-color:var(--acid)}button:disabled{opacity:.4;cursor:not-allowed}
.pri{background:var(--acid2)!important;color:#061!important;font-weight:700;border-color:var(--acid)!important}
.danger{border-color:var(--bad);color:#ff9a9a}
input,textarea{width:100%}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acid2);min-height:auto}
label{display:block;margin:6px 0;color:var(--dim)}label input,label select{margin-top:2px;color:var(--ink)}
label.inl{display:inline-flex;gap:6px;align-items:center}
main{max-width:1300px;margin:auto;padding:14px}
.panel{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
h2{margin:0 0 6px;color:var(--acid);letter-spacing:1px}h3{color:var(--acid);margin:12px 0 4px;font-size:16px}
.hint,.small{color:var(--dim);font-size:13px}.small b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin:8px 0}
.card{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);overflow-wrap:anywhere}
.card.on{border-color:var(--acid);box-shadow:0 0 0 1px var(--acid) inset}.card.bad{border-color:var(--bad)}.card.dim{opacity:.55}
.diff{cursor:pointer;text-align:left;width:100%}.diff b{font-size:18px;color:var(--acid)}
.tag{font-size:11px;border:1px solid var(--acid2);color:var(--acid);border-radius:4px;padding:0 4px;display:inline-block;margin:1px}.tag.bad{border-color:var(--bad);color:#ff9a9a}.tag.dim{border-color:var(--dim);color:var(--dim)}.tag.foe{border-color:var(--foe);color:var(--foe)}.tag.amp{border-color:var(--splice);color:var(--splice)}
.bio{color:var(--bio)}.chrome{color:var(--chrome)}.splice{color:var(--splice)}
.bar{height:10px;background:#0a0d0c;border:1px solid var(--line);border-radius:5px;overflow:hidden;margin:3px 0;position:relative}.bar i{display:block;height:100%;background:var(--acid2)}.bar i.tmp{background:#8fd3ff;position:absolute;top:0}
.bar.flux i{background:var(--splice)}.bar.foe i{background:var(--foe)}.bar.low i{background:var(--bad)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:6px 0;font-size:12px}.nums div{background:var(--pan);border-radius:6px;padding:3px;text-align:center}.nums span{display:block;font-size:10px;color:var(--dim);text-transform:uppercase}
.errs{color:#ff9a9a;font-size:12.5px;margin:4px 0;padding-left:18px}.warns{color:var(--warn);font-size:12.5px;padding-left:18px}
/* battle: virtual tabletop */
.bpanel{padding:10px 12px}.bhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}.bhead h2{margin:0;font-size:19px}
.order{list-style:none;display:flex;flex-wrap:wrap;gap:4px;padding:0;margin:8px 0}.oc{font-size:12px;border:1px solid var(--line);border-radius:14px;padding:2px 9px;background:var(--pan2)}
.oc.pc{border-color:var(--acid2)}.oc.foe{border-color:var(--foe);color:#ffb38a}.oc.now{background:var(--acid2);color:#061;font-weight:700}.oc.foe.now{background:var(--foe);color:#200}.oc.done{opacity:.5}.oc.lab{border:0;background:none;color:var(--acid);font-weight:700}
.vtt{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;gap:10px;align-items:start}
.hud{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px}.pchud{border-color:var(--acid2)}.foehud{border-color:var(--foe)}
.hrow{display:flex;gap:8px;align-items:center;margin-bottom:4px}.nm{font-size:15px;color:var(--ink)}
.portrait{width:58px;height:58px;flex:none;border-radius:50%;background:#222 center/cover;border:3px solid var(--acid2);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.portrait.chrome{border-color:var(--chrome)}.portrait.splice{border-color:var(--splice)}.portrait.foe{border-color:var(--foe);background:radial-gradient(circle at 35% 30%,#7a2b1a,#250a05)}.portrait.boss{border-width:4px;box-shadow:0 0 12px rgba(255,138,90,.6)}
.lbl{font-size:12px;color:var(--dim);margin-top:4px}.lbl b{color:var(--ink)}.tmpv{color:#8fd3ff}.warnv{color:var(--warn)}
.hud .nums{grid-template-columns:repeat(4,1fr)}.hud .nums div{font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}.acts span{font-size:12px;border:1px dashed var(--line);border-radius:5px;padding:1px 6px;color:var(--dim)}.acts span.on{border-style:solid;border-color:var(--acid2);color:var(--acid)}
.atks{margin:4px 0;padding-left:16px;font-size:12px}.tac{font-style:italic}
.mapwrap{position:relative;border:2px solid #3a463f;border-radius:10px;overflow:hidden;background:#000}
.mapwrap::before{content:"";position:absolute;inset:-20px;background:var(--art) center/cover;filter:blur(10px) brightness(.35) saturate(1.2);z-index:0}
.mapscroll{position:relative;z-index:1;overflow:auto;max-height:66vh;padding:14px;-webkit-overflow-scrolling:touch}
.map{position:relative;width:calc(var(--cs)*var(--w));height:calc(var(--cs)*var(--h));margin:auto;border-radius:6px;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 8px 30px rgba(0,0,0,.7)}
.map:focus-visible{outline:3px solid var(--acid);outline-offset:4px}
.cells{display:grid;grid-template-columns:repeat(var(--w),var(--cs));grid-auto-rows:var(--cs)}
.cell{position:relative;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
.cell.mv{background:rgba(98,215,255,.22);box-shadow:inset 0 0 0 1px rgba(98,215,255,.5)}.cell.mv::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(98,215,255,.8)}
.cell.mv.faint{background:rgba(98,215,255,.08);box-shadow:none}.cell.mv.faint::after{width:4px;height:4px;margin:-2px;opacity:.5}
.cell.path{background:rgba(98,215,255,.45)}
.cell.rng{background:rgba(182,255,46,.13);box-shadow:inset 0 0 0 1px rgba(182,255,46,.28)}.cell.rng.long{background:repeating-linear-gradient(45deg,rgba(255,194,61,.1) 0 4px,transparent 4px 8px)}
.cell.aoe{background:repeating-linear-gradient(135deg,rgba(255,95,210,.45) 0 5px,rgba(255,95,210,.2) 5px 10px);box-shadow:inset 0 0 0 1px rgba(255,95,210,.8)}.cell.aoe.bad{background:repeating-linear-gradient(135deg,rgba(150,150,150,.35) 0 5px,transparent 5px 10px)}
.cell.cur{box-shadow:inset 0 0 0 3px var(--warn)!important;z-index:1}
.cell.blast{background:radial-gradient(circle,rgba(255,220,120,.85),rgba(255,90,40,.55))!important;transition:background .1s}
.cell .mk{position:absolute;right:2px;top:0;font-size:11px;color:var(--warn)}
.cell.ob{background:none}.cell.ob::before{content:"";position:absolute;inset:3px;border-radius:4px;box-shadow:0 3px 6px rgba(0,0,0,.6)}
.ob-pipe::before{background:linear-gradient(90deg,#4b5a55,#9fb1a9 45%,#4b5a55)!important;inset:8px 1px!important;border-radius:10px!important}
.ob-valve::before{background:radial-gradient(circle,#c33 0 22%,#555 24% 48%,#2b302e 50%)!important;border-radius:50%!important}
.ob-crate::before,.ob-container::before{background:repeating-linear-gradient(90deg,#6b4a25 0 6px,#80592c 6px 12px)!important;border:2px solid #3d2a14}
.ob-container::before{background:repeating-linear-gradient(90deg,#7a2f22 0 5px,#93402e 5px 9px)!important}
.ob-car::before{background:linear-gradient(#556,#334)!important;border-radius:9px!important;inset:5px 2px!important}
.ob-barrel::before{background:radial-gradient(circle,#c8a12a 0 30%,#7c5f0f 32%)!important;border-radius:50%!important;inset:7px!important}
.ob-rubble::before{background:radial-gradient(circle at 30% 40%,#777 0 20%,transparent 22%),radial-gradient(circle at 70% 60%,#666 0 25%,transparent 27%),radial-gradient(circle at 45% 75%,#555 0 18%,#3a3a3a 20%)!important;border-radius:40%!important}
.ob-barricade::before{background:repeating-linear-gradient(45deg,#e0b400 0 6px,#222 6px 12px)!important;inset:12px 1px!important}
.ob-tower::before{background:linear-gradient(#5a6a62,#2c3531)!important;border:2px solid #8aa}
.ob-vat::before{background:radial-gradient(circle,rgba(140,255,106,.85),rgba(30,90,40,.9) 60%,#203)!important;border-radius:50%!important;border:2px solid #9ab}
.ob-console::before{background:linear-gradient(#123,#012)!important;border:2px solid var(--chrome);box-shadow:0 0 8px rgba(98,215,255,.6)!important}
.ob-gurney::before{background:linear-gradient(#ccd,#99a)!important;inset:12px 3px!important}
.ob-growth::before{background:radial-gradient(circle at 40% 40%,#ff5fd2 0 15%,#5b1f6b 40%,#2a0f2c 70%)!important;border-radius:45% 55% 40% 60%!important}
.ob-pod::before{background:radial-gradient(circle,#b6ff2e 0 15%,#3f6b1a 50%,#1b2a0e)!important;border-radius:50%!important}
/* themed floors */
.theme-pumpstation .cells{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),repeating-linear-gradient(0deg,#3b4643 0 2px,transparent 2px 23px),repeating-linear-gradient(90deg,#3b4643 0 2px,transparent 2px 23px),radial-gradient(circle at 30% 40%,#5d4a2b,transparent 40%),linear-gradient(135deg,#2a3431,#1d2523)}
.theme-streets .cells{background:radial-gradient(ellipse at 60% 50%,rgba(70,110,140,.35),transparent 50%),repeating-linear-gradient(90deg,transparent 0 46%,rgba(230,200,60,.25) 46% 48%,transparent 48%),linear-gradient(160deg,#25292c,#16191b)}
.theme-camp .cells{background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 46px),linear-gradient(135deg,#4a4a42,#2e2f2a)}
.theme-clinic .cells{background:repeating-linear-gradient(0deg,rgba(255,255,255,.12) 0 1px,transparent 1px 23px),repeating-linear-gradient(90deg,rgba(255,255,255,.12) 0 1px,transparent 1px 23px),linear-gradient(135deg,#9fb8b6,#6f8c8a)}
.theme-rustyard .cells{background:radial-gradient(circle at 70% 30%,rgba(140,70,30,.5),transparent 45%),radial-gradient(circle at 20% 80%,rgba(40,80,90,.5),transparent 40%),linear-gradient(135deg,#4a3324,#2a1d15)}
.theme-bloom .cells{background:radial-gradient(circle at 30% 30%,rgba(255,95,210,.25),transparent 35%),radial-gradient(circle at 75% 65%,rgba(182,255,46,.18),transparent 40%),linear-gradient(135deg,#2a1830,#120a16)}
.theme-clinic .cell{border-color:rgba(0,0,0,.12)}
/* tokens */
.tok{position:absolute;left:calc(var(--x)*var(--cs));top:calc(var(--y)*var(--cs));width:var(--cs);height:var(--cs);padding:3px;margin:0;border:0;background:none;min-height:0;transition:left .14s linear,top .14s linear,opacity .3s;z-index:2;cursor:pointer}
.tok .ring{position:absolute;inset:2px;border-radius:50%;background:conic-gradient(var(--hpc,#4cc300) calc(var(--hp)*1%),rgba(0,0,0,.65) 0)}
.tok.foe{--hpc:#ff8a5a}.tok .face{position:absolute;inset:6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cs)*.3);color:#fff;text-shadow:0 1px 2px #000;background:#2f6b1a center/cover;box-shadow:inset 0 0 0 2px rgba(0,0,0,.5)}
.tok.pc.bio .face{background-image:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),url(../art/char_bio.jpg)}.tok.pc.chrome{--hpc:#62d7ff}.tok.pc.chrome .face{background-image:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),url(../art/char_chrome.jpg)}.tok.pc.splice{--hpc:#ff5fd2}.tok.pc.splice .face{background-image:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.3)),url(../art/char_splice.jpg)}
.tok.foe .face{background:radial-gradient(circle at 35% 30%,#a5402a,#3a0f08);border-radius:22%}.tok.foe .ring{border-radius:24%}.tok.big .face{box-shadow:inset 0 0 0 2px var(--warn)}
.tok.act .ring{box-shadow:0 0 0 3px var(--acid),0 0 14px var(--acid)}.tok.sel .ring{box-shadow:0 0 0 2px var(--foe)}
.tok.tgt .ring{box-shadow:0 0 0 3px var(--warn),0 0 12px var(--warn);animation:pulse 1s infinite alternate}.tok.tgt.dis .ring{box-shadow:0 0 0 3px var(--warn);animation:none}
.tok.no{opacity:.45}.tok.ally-hit .ring{box-shadow:0 0 0 3px var(--splice)}
.tok.down .face{filter:grayscale(1) brightness(.6)}.tok.dead{opacity:.35}.tok.dead .face{filter:grayscale(1)}.tok.dom .face{box-shadow:inset 0 0 0 3px var(--acid)}
.tok .st{position:absolute;right:-2px;top:-4px;font-size:14px;font-weight:800;color:#fff;text-shadow:0 0 3px #000}.tok .st.tg{color:var(--warn)}
.tok .cb{position:absolute;left:0;right:0;bottom:-3px;font-size:9px;line-height:1;text-align:center;color:#fff;background:rgba(0,0,0,.75);border-radius:4px;white-space:nowrap;overflow:hidden}
.tok.flash .ring{box-shadow:0 0 0 4px #fff,0 0 20px var(--warn)!important}.tok.hit{animation:shake .25s 2}
@keyframes pulse{to{box-shadow:0 0 0 3px var(--warn),0 0 4px var(--warn)}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.float{position:absolute;left:calc(var(--x)*var(--cs));top:calc(var(--y)*var(--cs));width:var(--cs);text-align:center;font-weight:900;font-size:18px;text-shadow:0 0 4px #000,0 0 2px #000;animation:rise 1.1s ease-out forwards}
.float.dmg{color:#ff6b5a}.float.heal{color:#9dff9d}@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-34px);opacity:0}}
@media (prefers-reduced-motion:reduce){.tok{transition:none}.float,.tok.hit,.tok.tgt .ring{animation:none}}
.maptools{position:relative;z-index:1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:center;padding:4px 10px;background:rgba(0,0,0,.6)}.maptools button{min-width:36px}
/* JRPG menu */
.dock{margin-top:10px}.menu{background:linear-gradient(180deg,#14201b,#0e1512);border:2px solid var(--acid2);border-radius:10px;padding:8px 10px;box-shadow:0 0 0 1px #000,0 4px 18px rgba(0,0,0,.5)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.mhead b{color:var(--acid);letter-spacing:.5px}
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:5px;max-height:34vh;overflow:auto;padding:2px}
.rootcmds{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.cmd{text-align:left;display:flex;justify-content:space-between;gap:6px;align-items:flex-start;background:#0b1210;border:1px solid #2f4a3c}
.cmd.root{flex-direction:column}.cmd small{display:block;color:var(--dim);font-size:11.5px}.cmd small.why{color:#ff9a9a}.cmd small.ok{color:var(--acid)}
.cmd:focus-visible,.cmd:hover{border-color:var(--acid);background:#13221b}.cmd:focus-visible::before{content:"▶";color:var(--acid);margin-right:2px}
.cmd[aria-disabled=true]{opacity:.5}.cmd .k{display:inline-block;min-width:16px;color:var(--dim);font-size:11px;margin-right:4px}.cmd .meta{text-align:right;white-space:nowrap}.cmd .fx{color:var(--splice);font-weight:700;display:block}
.cmd.over{border-color:var(--warn)}.back{min-height:30px;padding:2px 8px}
.banner{min-height:1.4em;margin:4px 0;color:var(--ink);font-size:13.5px}
.autorow{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
.logbox{margin-top:10px}.logbox summary{cursor:pointer;color:var(--acid);padding:4px 0}
@media (max-width:1100px){.vtt{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.vtt .mapcol{grid-column:1/-1;order:-1}}
@media (max-width:640px){.vtt{grid-template-columns:minmax(0,1fr);gap:6px}.hud{padding:6px}.hud .nums,.hud .atks,.hud .tac,.foehud .small{display:none}.portrait{width:40px;height:40px}
  .mapscroll{max-height:52vh;padding:6px}.dock{position:sticky;bottom:0;z-index:6;margin:6px -10px -10px}.menu{border-radius:10px 10px 0 0}.cmds{max-height:30vh;grid-template-columns:1fr 1fr}.rootcmds{grid-template-columns:1fr 1fr}
  .autorow label{display:none}.order{flex-wrap:nowrap;overflow-x:auto}.oc{white-space:nowrap}}
/* battle (old card layout, used on the prime screen) */
.battle{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:12px}
.side h3{margin-top:0}.pcard,.ecard{margin-bottom:8px}.pcard.act{border-color:var(--acid);box-shadow:0 0 10px rgba(182,255,46,.25)}.pcard.down{border-color:var(--bad)}.ecard.dead{opacity:.4}
.opts{display:flex;flex-direction:column;gap:6px}.opt{text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.opt small{color:var(--dim);display:block;font-size:12px}.opt .k{color:var(--dim);font-size:11px;white-space:nowrap}
.center .opts{max-height:52vh;overflow:auto;padding:2px}
.opt.over{border-color:var(--warn)}.opt .fx{color:var(--splice);font-weight:700;white-space:nowrap}
.grp{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:8px 0 2px;border-bottom:1px solid var(--line)}
#log{background:#090c0b;border:1px solid var(--line);border-radius:8px;padding:8px;height:34vh;overflow:auto;font:12.5px/1.4 ui-monospace,Consolas,monospace;white-space:pre-wrap}
#log .round{color:var(--acid);font-weight:700;margin-top:6px;border-top:1px solid var(--line)}#log .turn{color:var(--chrome)}#log .foe{color:#ffb38a}#log .bad{color:#ff8a8a}#log .heal{color:#9dff9d}
#log .crit{color:var(--warn);font-weight:700}#log .over{color:var(--splice)}#log .down,#log .dead,#log .lose{color:var(--bad);font-weight:700}#log .win,#log .kill{color:var(--acid)}#log .sys{color:var(--dim)}#log .big{font-weight:700}#log .miss{color:#9aa}
.dice{display:inline-flex;gap:4px;flex-wrap:wrap}.die{display:inline-block;min-width:30px;text-align:center;border:1px solid var(--acid2);border-radius:6px;padding:2px 4px;font-weight:700}
.ladder{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:8px 0}.rung{background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:4px;text-align:center;font-size:12px}.rung.done{border-color:var(--acid2);color:var(--acid)}.rung.cur{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.rung b{display:block;font-size:16px}
.choice{display:block;width:100%;text-align:left;margin:3px 0;padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--pan);color:var(--ink);cursor:pointer}.choice.on{border-color:var(--acid);background:rgba(76,195,0,.12)}.choice small{display:block;color:var(--dim)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}.tabs button[aria-selected=true]{border-color:var(--acid);color:var(--acid)}
@media (max-width:640px){table.t{display:block;overflow-x:auto;max-width:100%}}
table.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}.t td,.t th{border:1px solid var(--line);padding:3px 6px;text-align:left}.t th{color:var(--dim)}
.big{font-size:28px;letter-spacing:3px;color:var(--acid);text-shadow:0 0 10px rgba(182,255,46,.4);margin:4px 0}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

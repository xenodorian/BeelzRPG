<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutagen Character Builder</title>
<!-- Mutagen Character Builder. Single self-contained file: no CDNs, no build step.
     Works from file:// and GitHub Pages. GAME DATA is the first <script> block below:
     update it when the rules in chapters/02-08 change. App code follows it. -->
<style>
:root{--bg:#0d1110;--pan:#161c1a;--pan2:#1e2623;--ink:#dfe8e2;--dim:#8fa39a;--acid:#b6ff2e;--acid2:#4cc300;--chrome:#62d7ff;--bio:#8cff6a;--splice:#ff5fd2;--bad:#ff5a5a;--warn:#ffc23d;--line:#2c3833}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acid)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#0d1110 0%,rgba(13,17,16,.92) 60%,rgba(13,17,16,.75)),url(../art/cover.jpg) center/cover;border-bottom:2px solid var(--acid2);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{margin:0 12px 0 0;font-size:22px;letter-spacing:4px;color:var(--acid);text-shadow:0 0 8px rgba(182,255,46,.5)}
header h1 small{font-size:11px;letter-spacing:1px;color:var(--dim);display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--acid)}button:disabled{opacity:.4;cursor:not-allowed}
.btn.pri,#btnRandom{background:var(--acid2);color:#061;font-weight:700;border-color:var(--acid)}
input,textarea{width:100%}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acid2)}
label{display:block;margin:6px 0;color:var(--dim)}label input,label select,label textarea{margin-top:2px;color:var(--ink)}
label.inl{display:inline-flex;gap:6px;align-items:center}
#steps{display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px;background:var(--pan);border-bottom:1px solid var(--line)}
.stp{font-size:13px;background:transparent}.stp b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--line);text-align:center;font-size:12px}
.stp.on{border-color:var(--acid);color:var(--acid)}.stp.on b{background:var(--acid2);color:#061}.stp.bad b{background:var(--bad);color:#200}.stp.warn b{background:var(--warn);color:#320}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px;max-width:1300px;margin:auto}
#panel{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
#panel h2{margin:0 0 6px;color:var(--acid);letter-spacing:1px}#panel h3{color:var(--acid);margin:16px 0 4px;font-size:16px}
aside{position:sticky;top:120px;align-self:start;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:12px}
aside h3{margin:0;color:var(--acid)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}.nums div{background:var(--pan2);border-radius:6px;padding:4px;text-align:center}.nums span{display:block;font-size:10px;color:var(--dim);text-transform:uppercase}.nums b{font-size:18px}
.mini,.small{font-size:12.5px;color:var(--dim)}.small b{color:var(--ink)}
.status{margin:8px 0 4px;padding:6px;border-radius:6px;font-weight:700;text-align:center}.status.ok{background:rgba(76,195,0,.2);color:var(--acid)}.status.no{background:rgba(255,90,90,.15);color:var(--bad)}
.msgs{list-style:none;padding:0;margin:0;font-size:12.5px;max-height:40vh;overflow:auto}.msgs li{padding:3px 4px;border-bottom:1px solid var(--line);cursor:pointer}.msgs .e{color:#ff9a9a}.msgs .w{color:var(--warn)}
.hint{color:var(--dim);margin:2px 0 10px}.errc{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>label{flex:1 1 200px}.lbl{min-width:70px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:6px 0}
.card{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:8px;margin:0;color:var(--ink)}.card.on{border-color:var(--acid);box-shadow:0 0 0 1px var(--acid) inset}.card.badc{border-color:var(--bad)}.card select{width:auto}.tot{font-weight:700;color:var(--acid)}
.pickc{cursor:pointer}
.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}.t td,.t th{border:1px solid var(--line);padding:3px 6px;text-align:left}.t th{color:var(--dim)}.t tr.cur td{background:rgba(76,195,0,.15)}
.formbox{background:var(--pan2);border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px}
.form.bio{color:var(--bio)}.form.chrome{color:var(--chrome)}.form.splice{color:var(--splice)}
.trees{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tree{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--pan2)}.tree.own{border-color:var(--acid2)}.tree.own.chrome{border-color:var(--chrome)}.tree.own.bio{border-color:var(--bio)}
.th{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}.th>b{font-size:17px;color:var(--acid)}
.formsel{display:flex;gap:10px;margin-top:4px}.formsel label{margin:0;display:inline-flex;gap:4px;align-items:center}.formsel .bio{color:var(--bio)}.formsel .chrome{color:var(--chrome)}.look{font-style:italic}
.node{display:block;margin:4px 0;padding:5px 6px;border-radius:6px;color:var(--ink);cursor:pointer}.node:hover{background:rgba(255,255,255,.03)}.node.on{background:rgba(76,195,0,.14)}.node.dis{opacity:.5;cursor:not-allowed}
.tag{font-size:10.5px;border:1px solid var(--acid2);color:var(--acid);border-radius:4px;padding:0 4px}.tag.no{border-color:var(--dim);color:var(--dim)}
.slot{border:1px solid var(--line);background:var(--pan2);border-radius:8px;padding:8px;margin:6px 0}.slot.wild{border-style:dashed;color:var(--dim)}.slot.bads{border-color:var(--bad)}
.slot .row input{flex:1 1 150px;width:auto}.slot select{flex:0 1 auto}.num{font-size:18px;color:var(--acid);width:24px}.flux{font-weight:700;color:var(--splice);white-space:nowrap}
.ib{padding:2px 7px}.tw{display:flex;flex-wrap:wrap;gap:4px 10px;margin:6px 0 2px}.tw label{margin:0;display:inline-flex;gap:3px;align-items:center;font-size:13px;color:var(--ink)}.tw label.dis{opacity:.4}.tw .smp{color:var(--warn)}
.line{color:#cfe6d8}.err{color:#ff9a9a}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.items label{margin:0;font-size:13px;color:var(--ink)}.items input{width:70px}
details{margin-top:10px}summary{cursor:pointer;color:var(--acid)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.sheetwrap{background:#fff;color:#111;border-radius:6px;padding:10px;overflow:auto}
/* Character sheet (matches sheets/Character_Sheet.html) */
.sheet{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;max-width:7.7in;margin:auto;background:#fff}
.sheet h1{font-size:22px;margin:0 0 4px;letter-spacing:3px;border-bottom:3px solid #4c0;padding-bottom:2px;color:#111}
.sheet h2{font-size:12px;background:#222;color:#bf0;padding:2px 6px;margin:8px 0 3px;text-transform:uppercase;letter-spacing:1px}
.sheet table{width:100%;border-collapse:collapse}.sheet td,.sheet th{border:1px solid #555;padding:3px 4px;vertical-align:top;text-align:left}.sheet th{background:#eee;font-size:10px}
.sheet b,.sheet .small b{color:#111}.sheet i{color:#333}
.sheet .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet .small{font-size:10px;color:#222}.sheet small{color:#555}.sheet tr.off td{background:#f3f3f3;color:#bbb}
.sheet .bx{display:inline-block;width:11px;height:11px;border:1px solid #333;margin-right:2px;vertical-align:middle}.sheet .feats{margin:2px 0;padding-left:16px}.sheet p{margin:2px 0}
#printArea{display:none}
@media (max-width:860px){header{position:static}main{grid-template-columns:1fr}aside{position:static;order:-1}.nums{grid-template-columns:repeat(4,1fr)}header h1{font-size:18px}.msgs{max-height:none}}
@media print{@page{size:letter;margin:.4in}body{background:#fff}#app{display:none!important}#printArea{display:block!important}.sheet h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app">
<header><h1>MUTAGEN<small>Character Builder · v0.1.1</small></h1>
<div class="tools">
<select id="lvlTop" aria-label="Level"></select>
<button id="btnRandom" title="Random legal character at this level">⚄ Random</button>
<select id="exSel" aria-label="Load example"><option value="">Example…</option><option value="dree1">Dree, level 1 (guide)</option><option value="dree5">Dree, level 5 (guide)</option></select>
<button id="btnNew">New</button><button id="btnSave">Save</button><select id="loadSel" aria-label="Load saved"></select>
<button id="btnExport">Export</button><button id="btnImport">Import</button><input type="file" id="importFile" accept=".json,application/json" hidden>
</div></header>
<nav id="steps"></nav>
<main><section><div id="panel"></div><div class="nav"><button id="prevB">← Back</button><button id="nextB" class="btn pri">Next →</button></div></section><aside id="summary"></aside></main>
</div>
<div id="printArea"></div>
<script>

        { id: "longsight", name: "Long Sight", text: "Double the range of your ranged attacks and ranged Surges. Ignore partial cover. Read lips at 300 ft.", fx: { rangedDouble: true } },
        { id: "deadeye", name: "Deadeye", apex: true, push: true, text: "Your ranged attacks (weapons, Spit, Mind Spike, ranged Surges) Crit on 18-20. Once per round, Push to reroll a missed attack.", fx: { critRanged: 18 } }

}

/* ---------- derive: every number and every legality check ---------- */

  const bioN = owned.filter(t => s.trees[t] === "bio").length, chromeN = owned.filter(t => s.trees[t] === "chrome").length;

  const scars = s.scars.filter(id => SCAR[id]);

  const sticky = scars.includes("stickyrelay");
  // HP, Armor, Speed, Limit

  const armorSrc = []; const suit = D.armors.find(a => a.id === s.armor) || D.armors[0];
  armorSrc.push([suit.name, suit.armor]);
  if (s.shield) armorSrc.push(["Shield", D.shield.armor]);
  if (has("plating")) armorSrc.push(["Plating", R >= 3 ? 2 : 1]);
  if (sfx("armor")) armorSrc.push(["Scars/Faults", sfx("armor")]);
  const armorRaw = armorSrc.reduce((a, x) => a + x[1], 0);
  if (armorRaw > D.armorMax) warn(6, `Armor ${armorRaw} is capped at ${D.armorMax}.`);
  const armor = Math.max(0, Math.min(D.armorMax, armorRaw));
  const speed = D.baseSpeed + (fx.speed || []).reduce((a, b) => a + b, 0) + (suit.speed || 0) + sfx("speed");
  const limit = Math.max(D.fluxMin, D.fluxBase + R + st.nerve) + (form === "splice" ? D.spliceFlux : 0) + sfx("flux") + (s.patchApplied ? 1 : 0);
  const def = { dodge: st.moxie + R, endure: st.grit + R, resist: st.nerve + R };
  const prime = L.prime + (has("hivemind") ? 1 : 0);
  const slots = L.die - (sticky ? 1 : 0);
  const known = Math.min(slots, L.surges + (origin && origin.extraSurge ? origin.extraSurge : 0));
  // Unlocked parts
  const unlocked = new Set(); owned.forEach(t => TREE[t].unlocks.forEach(u => unlocked.add(u)));
  const partOk = p => !p.unlock || owned.includes(p.unlock);
  const c = { R, st, s, owned, fx, has, unlocked };
  // Surges
  const surges = s.surges.map((sg, i) => surgeCalc(sg, i, c));
  surges.forEach(x => x.errs.forEach(m => err(4, `Slot ${x.slot} (${x.name || "unnamed"}): ${m}`)));
  const nonSample = s.surges.filter(x => !x.sample).length;
  if (nonSample > known) err(4, `You know ${known} Surges at level ${s.level}; remove ${nonSample - known} (Samples aside).`);
  if (s.surges.length > slots) err(4, `Your Sequence has ${slots} slots; you have ${s.surges.length} Surges.`);
  if (nonSample < known) warn(4, `${known - nonSample} Surge(s) not built yet; those slots stay Wild.`);
  const wild = Math.max(0, L.die - s.surges.length);
  // Gear
  const gear = gearCalc(s, c, E, W, err);
  const upkeep = D.upkeepPerChrome * chromeN + gear.smartlinks * 25;
  return { s, L, R, st, origin, knacks, knReq, nodes, owned, form, bioN, chromeN, hp, armor, armorRaw, armorSrc, speed, limit, def,
    prime, maxPrimed: prime + 1, die: L.die, slots, known, wild, sticky, surges, unlocked, gear, upkeep, scars,
    knit: R * bioN, errors: E, warnings: W, legal: E.length === 0, partOk };
}

function surgeCalc(sg, i, c) {
  const out = { slot: i + 1, name: sg.name || "", errs: [], flux: 1, line: "", fw: false };
  const sh = SHAPE[sg.shape], ef = EFFECT[sg.effect];
  if (!sh) { out.errs.push("choose a Shape."); return out; }
  if (!ef) { out.errs.push("choose an Effect."); return out; }
  out.build = sh.name + " + " + ef.name + (sg.twists || []).map(t => TWIST[t] ? " + " + TWIST[t].name : "").join("");
  if (sh.kind !== ef.kind) out.errs.push(sh.kind === "infuse" ? "Infuse takes an Infuse Effect (Mend, Shell, Haste, Veil, Link)." : `${ef.name} is an Infuse Effect; it only goes with Infuse.`);
  if (!sg.sample) {
    if (sh.unlock && !c.owned.includes(sh.unlock)) out.errs.push(`${sh.name} needs the ${TREE[sh.unlock].name} Root.`);
    if (ef.unlock && !c.owned.includes(ef.unlock)) out.errs.push(`${ef.name} needs the ${TREE[ef.unlock].name} Root.`);
  }
  const tw = (sg.twists || []).filter(t => TWIST[t]);
  const maxT = D.twistsByRank(c.R);
  if (tw.length > maxT) out.errs.push(`max ${maxT} Twist${maxT > 1 ? "s" : ""} at Rank ${c.R}.`);
  if (new Set(tw).size !== tw.length) out.errs.push("Twists must be different.");
  tw.forEach(t => {
    const w = TWIST[t].works;
    if (w === "strikebolt" && !(sh.id === "strike" || sh.id === "bolt")) out.errs.push(`${TWIST[t].name} only works with Strike or Bolt.`);
    if (w === "area" && !sh.area) out.errs.push(`${TWIST[t].name} only works with Burst, Wave, or Pulse.`);
    if (w === "damage" && sh.kind !== "damage") out.errs.push(`${TWIST[t].name} only works with damage Surges.`);
  });
  out.flux = 1 + tw.length;
  if (ef.id === "mend" && c.has("livingpharmacy")) out.flux = 0;
  out.fw = [sh.unlock, ef.unlock].some(u => u && c.s.trees[u] === "chrome" && c.owned.includes(u));
  const R = c.R, tws = tw.map(t => TWIST[t].name);
  if (sh.kind === "damage" && ef.kind === "damage") {
    let opts = sh.stats.slice(); if (ef.altStat) opts.push(ef.altStat);
    const stat = opts.reduce((a, b) => (c.st[b] > c.st[a] ? b : a), opts[0]);
    const dice = R + 1 + (ef.extraDice || 0) + tw.reduce((a, t) => a + (TWIST[t].extraDice || 0), 0);
    out.atk = c.st[stat] + R; out.stat = stat;
    out.dmg = `${dice}d${sh.die}` + (sh.addStat ? (c.st[stat] ? sgn(c.st[stat]) : "") : "");
    let rng = sh.id === "strike" ? (tw.includes("reach") ? "reach 15 ft" : "melee") : sh.target;
    if (sh.id === "bolt") { let r = 60 * (c.fx.rangedDouble ? 2 : 1) * (tw.includes("reach") ? 2 : 1); rng = `${r} ft`; }
    if (sh.id === "burst") { rng = `10-ft radius within ${60 * (c.fx.rangedDouble ? 2 : 1)} ft` + (tw.includes("reach") ? " (Reach: double range or radius)" : ""); }
    if ((sh.id === "wave" || sh.id === "pulse") && tw.includes("reach")) rng += " (Reach: doubled)";
    out.range = rng;
    out.line = `${sgn(out.atk)} (${STAT_NAME[stat]}) \u00b7 ${out.dmg} ${ef.type} \u00b7 ${tok(ef.rider, c)} \u00b7 ${rng}` + (sh.area ? " \u00b7 Area: miss = half, no rider" : "") + (sh.hitsAllies ? "; allies in it Dodge" : "");
  } else if (sh.kind === "infuse" && ef.kind === "infuse") {
    out.line = tok(ef.text, c) + (tws.includes("Sure") ? " (Sure: +1 ally)" : "");
  }
  const twShow = tw.filter(t => !(t === "reach" && sh.kind === "damage"));
  if (twShow.length) out.line += " \u00b7 " + twShow.map(t => TWIST[t].name + ": " + tok(TWIST[t].text, c)).join(" ");
  return out;
}

function kitWeapons(s) {
  const k = KIT[s.kit]; if (!k) return [];
  return k.weapons.map((w, i) => {
    let frame = w, free = "";
    if (typeof w === "object" && w.choice) frame = w.choice.includes(s.kitChoice) ? s.kitChoice : w.choice[0];
    else if (typeof w === "object") { frame = w.frame; free = w.mod; }
    const mod = s.kitMods[i] !== undefined ? s.kitMods[i] : free;
    return { frame, mod, free, src: "kit", idx: i };
  });
}

function gearCalc(s, c, E, W, err) {
  const k = KIT[s.kit];
  if (!k) err(5, "Choose a Starting Kit.");
  const origin = ORIGIN[s.origin];
  const start = D.startScrip + (origin && origin.scrip || 0) + (k && k.scrip || 0);
  let spent = 0; const lines = [];
  const weapons = kitWeapons(s).map(w => { if (w.mod && w.mod !== w.free) { spent += D.modCost; lines.push([`${MOD[w.mod].name} on ${FRAME[w.frame].name}`, D.modCost]); } return w; });
  (s.buyWeapons || []).forEach((w, i) => {
    if (!FRAME[w.frame]) return;
    spent += FRAME[w.frame].cost; lines.push([FRAME[w.frame].name, FRAME[w.frame].cost]);
    if (w.mod) { spent += D.modCost; lines.push([MOD[w.mod].name, D.modCost]); }
    weapons.push({ frame: w.frame, mod: w.mod || "", src: "buy", idx: i });
  });
  if (c.has("naturalweapons")) {
    weapons.unshift({ frame: "natural", mod: s.naturalMod || "", src: "node" });
    if (s.naturalMod) { spent += D.modCost; lines.push([`${MOD[s.naturalMod].name} on Natural weapons`, D.modCost]); }
  }
  weapons.push({ frame: "unarmed", mod: "", src: "always" });
  if (s.armor === "heavy") { spent += 120; lines.push(["Heavy armor", 120]); }
  if (s.shield) { spent += D.shield.cost; lines.push(["Shield", D.shield.cost]); }
  const items = {}; for (const id in D.commonKit.items) items[id] = D.commonKit.items[id];
  if (k) for (const id in k.items) items[id] = (items[id] || 0) + k.items[id];
  for (const id in s.buy) { const q = Math.max(0, parseInt(s.buy[id], 10) || 0); if (q && ITEM[id]) { items[id] = (items[id] || 0) + q; spent += q * ITEM[id].cost; lines.push([`${q} \u00d7 ${ITEM[id].name}`, q * ITEM[id].cost]); } }
  const scrip = start + (Number(s.scripAdj) || 0) - spent;
  if (scrip < 0) err(5, `Not enough Scrip: ${scrip} after purchases.`);
  let smartlinks = 0;
  const attacks = weapons.map(w => {
    const f = FRAME[w.frame], m = MOD[w.mod];
    if (m && m.only === "ranged" && !f.ranged) err(5, `${m.name} only fits ranged weapons (${f.name}).`);
    if (m && m.only === "melee" && !f.melee) err(5, `${m.name} only fits melee weapons (${f.name}).`);
    if (m && m.upkeep) smartlinks++;
    return attackLine(f.name + (m ? ` (${m.name})` : ""), f.die, f.stats, f.range, !!f.ranged, f.melee, m, c, w.frame === "natural", f.notes);
  });
  c.owned.forEach(t => TREE[t].nodes.forEach(n => { if (c.has(n.id) && n.fx && n.fx.attack) { const a = n.fx.attack; attacks.splice(attacks.length - 1, 0, attackLine(a.name, a.die, a.stats, a.range, true, false, null, c, false, a.note)); } }));
  return { start, spent, scrip, lines, items, weapons, attacks, smartlinks };
}

function attackLine(name, die, stats, range, ranged, melee, mod, c, natural, notes) {
  const stat = stats.reduce((a, b) => (c.st[b] > c.st[a] ? b : a), stats[0]);
  const atk = c.st[stat] + c.R + (mod && mod.attack || 0);
  let crit = 20; if (mod && mod.crit) crit = Math.min(crit, mod.crit); if (ranged && c.fx.critRanged) crit = Math.min(crit, 18);
  let rng = range;
  if (ranged && typeof range === "number") rng = range * (c.fx.rangedDouble ? 2 : 1) * (mod && mod.rangeDouble ? 2 : 1) + " ft";
  if (melee && (c.has("grapnel") || (mod && mod.id === "polehaft"))) rng = "Melee, reach 10 ft";
  const n = [];
  if (notes) n.push(notes);
  if (mod && !mod.crit && !mod.attack) n.push(mod.text);
  if (melee && name !== "Unarmed") (c.fx.meleeDie || []).forEach(x => n.push(`+1 die once/turn (${x})`));
  if (c.fx.anyDie) n.push("+1 die vs Target Lock mark");
  if (natural && c.has("crushergrip")) n.push("Crusher Grip: Held");
  if (natural && c.has("flurry")) n.push(`Flurry: 2nd attack ${Math.ceil(c.R / 2)}d${die}`);
  const st = c.st[stat];
  return { name, atk, stat, dmg: `${c.R}d${die}${st ? sgn(st) : ""}`, range: rng, crit: crit < 20 ? `${crit}\u201320` : "20", notes: n.join("; ") };
}

/* ---------- random legal character ---------- */
function randomChar(level) {
  const s = blank(); s.level = level || 1 + rnd(10);
  // apex check below: Apex needs level 7+ and 3 other nodes in its tree
  const L = lvl(s.level);
  const arr = shuffle(D.statArray); STAT_IDS.forEach((id, i) => s.stats[id] = arr[i]);
  const cur = Object.assign({}, s.stats);
  D.statBoostLevels.forEach(bl => { if (bl > s.level) return; const ok = shuffle(STAT_IDS.filter(x => cur[x] < D.statMax)); s.boosts[bl] = [ok[0], ok[1]]; cur[ok[0]]++; cur[ok[1]]++; });
  s.origin = pick(D.origins).id;
  let knReq = 0; for (const k in D.knackLevels) if (+k <= s.level) knReq += D.knackLevels[k];
  s.knacks = shuffle(D.knackExamples.filter(k => k !== ORIGIN[s.origin].knack)).slice(0, knReq - 1);
  const nTrees = Math.min(L.nodes, pick([1, 2, 2, 2, 3, 3]));
  const trees = shuffle(D.trees.map(t => t.id)).slice(0, nTrees);
  trees.forEach(t => { s.trees[t] = Math.random() < 0.5 ? "bio" : "chrome"; s.nodes.push(TREE[t].nodes[0].id); });
  let guard = 0;
  while (s.nodes.length < L.nodes && guard++ < 200) {
    const owned = Object.keys(s.trees);
    const elig = [];
    owned.forEach(t => TREE[t].nodes.forEach(n => {
      if (n.root || s.nodes.includes(n.id)) return;
      if (n.apex && (s.level < D.apexLevel || s.nodes.filter(x => NODE_TREE[x] === t).length < D.apexNeeds)) return;
      elig.push(n.id);
    }));
    if (!elig.length || (owned.length < 6 && Math.random() < 0.08)) {
      const t = pick(D.trees.filter(t => !owned.includes(t.id))); s.trees[t.id] = Math.random() < 0.5 ? "bio" : "chrome"; s.nodes.push(t.nodes[0].id); continue;
    }
    s.nodes.push(pick(elig));
  }
  const owned = Object.keys(s.trees);
  const okPart = p => !p.unlock || owned.includes(p.unlock);
  const known = Math.min(L.die, L.surges + (ORIGIN[s.origin].extraSurge || 0));
  const maxT = D.twistsByRank(L.rank);
  for (let i = 0; i < known; i++) {
    const sh = pick(D.shapes.filter(p => okPart(p) && D.effects.some(e => okPart(e) && e.kind === p.kind)));
    const ef = pick(D.effects.filter(e => okPart(e) && e.kind === sh.kind));
    const compat = D.twists.filter(t => t.works === "any" || (t.works === "strikebolt" && (sh.id === "strike" || sh.id === "bolt")) || (t.works === "area" && sh.area) || (t.works === "damage" && sh.kind === "damage"));
    const nt = Math.random() < 0.55 ? 0 : 1 + rnd(maxT);
    const tw = shuffle(compat).slice(0, nt).map(t => t.id);
    s.surges.push({ name: ef.name + " " + pick(D.surgeWords[sh.id]), shape: sh.id, effect: ef.id, twists: tw });
  }
  const k = pick(D.kits); s.kit = k.id; s.kitChoice = pick(["rifle", "shotgun"]);
  s.scripAdj = estimateScrip(s);
  const f = D.names; s.name = `${pick(f.first)} "${pick(f.nick)}" ${pick(f.last)}`;
  s.concept = `${pick(["Ex-cop", "Courier", "Street medic", "Scrap diver", "Failed priest", "Pump engineer", "Bouncer", "Bookie"])} who ${pick(["can't stop apologising", "owes everyone money", "talks to their augments", "hates GRAFT but needs the pay", "is looking for a missing sister"])}.`;
  s.drive = { why: "It was that or the flood.", goal: "Get out of Halcyon rich.", owe: "Owes a Ward loan shark." };
  return s;
}
function estimateScrip(s) {
  let earned = 0; for (let m = 1; m < s.level; m++) earned += D.missionPay(m);
  const chrome = Object.keys(s.trees).filter(t => s.trees[t] === "chrome" && s.nodes.includes(TREE[t].nodes[0].id)).length;
  return earned - chrome * D.upkeepPerChrome * (s.level - 1);
}
function fromExample(key) {
  const x = D.examples[key]; const s = blank();
  Object.assign(s, { name: x.name, concept: x.concept, level: x.level, stats: Object.assign({}, x.stats), boosts: JSON.parse(JSON.stringify(x.boosts)), origin: x.origin, knacks: x.knacks.slice(), trees: Object.assign({}, x.trees), nodes: x.nodes.slice(),
    surges: x.surges.map(a => ({ name: a[0], shape: a[1], effect: a[2], twists: a[3].slice() })), kit: x.kit, kitChoice: x.kitChoice, buy: Object.assign({}, x.buy), kitMods: Object.assign({}, x.kitMods || {}), scripAdj: x.scripAdj || 0, drive: Object.assign({}, x.drive) });
  return s;
}

let S = blank(), step = 0;
const STEPS = ["Start", "Stats", "Origin & Knacks", "Augments", "Surges", "Gear", "Extras & Drive", "Sheet"];
const LS = "mutagen.builder.";
function store(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
function load(k) { try { return JSON.parse(localStorage.getItem(LS + k)); } catch (e) { return null; } }
function getPath(o, p) { return p.split(".").reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; }
const sel = (path, opts, val, extra) => `<select data-k="${path}" ${extra || ""}>${opts.map(o => `<option value="${esc(o[0])}"${String(o[0]) === String(val) ? " selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`;
const levelOpts = D.levels.map(l => [l.lv, "Level " + l.lv]);

function render() {
  normalize(S);
  const d = derive(S);
  document.getElementById("lvlTop").value = S.level;
  document.getElementById("steps").innerHTML = STEPS.map((n, i) => {
    const bad = d.errors.some(e => e.step === i), w = d.warnings.some(e => e.step === i);

}

  <div class="nums">
   <div><span>HP</span><b>${d.hp}</b></div><div><span>Armor</span><b>${d.armor}</b></div><div><span>Speed</span><b>${d.speed}</b></div><div><span>Flux Limit</span><b>${d.limit}</b></div>
   <div><span>Dodge</span><b>${sgn(d.def.dodge)}</b></div><div><span>Endure</span><b>${sgn(d.def.endure)}</b></div><div><span>Resist</span><b>${sgn(d.def.resist)}</b></div><div><span>Sequence</span><b>d${d.die}</b></div>
   <div><span>Prime</span><b>${d.prime}</b></div><div><span>Surges</span><b>${S.surges.length}/${d.known}</b></div><div><span>Nodes</span><b>${d.nodes.length}/${d.L.nodes}</b></div><div><span>Scrip</span><b>${d.gear.scrip}</b></div>

function pStart(d) {
  return `<h2>1. Concept & Level</h2>
  <p class="hint">One sentence: a job, a body change, and a flaw. Then pick a level; everything that scales follows it. <a href="../chapters/13_Character_Building_Guide.md">Guide</a> \u00b7 <a href="../chapters/02_Character_Creation.md">Ch 2</a></p>

  let h = `<h2>2. Stats</h2><p class="hint">Assign +3, +2, +1, +0, \u22121, one each. Put +3 in the stat you'll attack with.</p><div class="cards">`;

  });

function pOrigin(d) {

    case "autostats": STAT_IDS.forEach((id, j) => S.stats[id] = D.statArray[j]); break;
    case "rollorigin": S.origin = D.origins[rnd(6)].id; break;
    case "addknack": S.knacks.push(""); break;
    case "addsurge": S.surges.push({ name: "", shape: "", effect: "", twists: [] }); break;
    case "addsample": S.surges.push({ name: "Sample", shape: "", effect: "", twists: [], sample: true }); break;
    case "randsurges": { const r = randomChar(S.level); const owned = d.owned; const okPart = p => !p.unlock || owned.includes(p.unlock); const maxT = D.twistsByRank(d.R);
      while (S.surges.filter(x => !x.sample).length < d.known && S.surges.length < d.slots) { const sh = pick(D.shapes.filter(p => okPart(p) && D.effects.some(e => okPart(e) && e.kind === p.kind))); const ef = pick(D.effects.filter(e => okPart(e) && e.kind === sh.kind)); S.surges.push({ name: ef.name + " " + pick(D.surgeWords[sh.id]), shape: sh.id, effect: ef.id, twists: [] }); } break; }
    case "up": if (i > 0) [S.surges[i - 1], S.surges[i]] = [S.surges[i], S.surges[i - 1]]; break;
    case "down": if (i < S.surges.length - 1) [S.surges[i + 1], S.surges[i]] = [S.surges[i], S.surges[i + 1]]; break;
    case "del": S.surges.splice(i, 1); break;
    case "addweapon": S.buyWeapons.push({ frame: "pistol", mod: "" }); break;
    case "delweapon": S.buyWeapons.splice(i, 1); break;
    case "estimate": S.scripAdj = estimateScrip(S); break;
    case "print": window.print(); return;
    case "export": exportJSON(); return;
    default: return;
  }
  render();
}
function exportJSON() {
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = (S.name || "freelancer").replace(/[^\w-]+/g, "_") + ".mutagen.json"; document.body.appendChild(a); a.click(); a.remove();
}
function refreshSaves() {
  const list = load("saves") || {};
  document.getElementById("loadSel").innerHTML = `<option value="">Load\u2026</option>` + Object.keys(list).map(n => `<option>${esc(n)}</option>`).join("");
}
function init() {
  const auto = load("autosave"); if (auto) S = normalize(auto);
  document.getElementById("lvlTop").innerHTML = levelOpts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join("");
  const app = document.getElementById("app");
  app.addEventListener("input", e => { if (e.target.matches("input[type=text],input:not([type]),textarea")) onField(e, false); });
  app.addEventListener("change", e => {
    const t = e.target;
    if (t.id === "lvlTop") { S.level = +t.value; render(); return; }
    if (t.id === "loadSel") { const l = load("saves") || {}; if (l[t.value]) { S = normalize(l[t.value]); render(); } t.value = ""; return; }
    if (t.id === "exSel") { if (t.value) { S = fromExample(t.value); step = 7; render(); } t.value = ""; return; }
    if (t.id === "importFile") { const f = t.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { S = normalize(JSON.parse(r.result)); render(); } catch (err) { alert("Not a Mutagen character file."); } }; r.readAsText(f); t.value = ""; return; }
    if (t.dataset.node) { const id = t.dataset.node; if (t.checked) S.nodes.push(id); else { S.nodes = S.nodes.filter(x => x !== id); if (NODE[id].root) { const tr = NODE_TREE[id]; S.nodes = S.nodes.filter(x => NODE_TREE[x] !== tr); delete S.trees[tr]; } } if (t.checked && NODE[id].root && !S.trees[NODE_TREE[id]]) S.trees[NODE_TREE[id]] = "bio"; render(); return; }
    if (t.dataset.twist !== undefined) { const sg = S.surges[+t.dataset.twist]; sg.twists = sg.twists || []; if (t.checked) sg.twists.push(t.value); else sg.twists = sg.twists.filter(x => x !== t.value); render(); return; }
    if (t.dataset.scar) { if (t.checked) S.scars.push(t.dataset.scar); else S.scars = S.scars.filter(x => x !== t.dataset.scar); render(); return; }
    if (t.dataset.act === "samplepick") { const x = D.sampleSurges[+t.value]; if (x) S.surges.push({ name: x[0], shape: x[1], effect: x[2], twists: x[3].slice() }); render(); return; }
    if (t.dataset.k) onField(e, true);
  });
  app.addEventListener("click", e => {
    const b = e.target.closest("[data-step],[data-act],#btnRandom,#btnNew,#btnSave");
    if (!b) return;
    if (b.id === "btnRandom") { S = randomChar(S.level); render(); return; }
    if (b.id === "btnNew") { if (confirm("Start a new blank character? (Unsaved changes are lost.)")) { const L = S.level; S = blank(); S.level = L; step = 0; render(); } return; }
    if (b.id === "btnSave") { const n = prompt("Save as:", S.name || "Freelancer"); if (n) { const l = load("saves") || {}; l[n] = JSON.parse(JSON.stringify(S)); store("saves", l); refreshSaves(); } return; }
    if (b.dataset.step !== undefined && b.tagName !== "SELECT") { step = +b.dataset.step; render(); window.scrollTo(0, 0); return; }
    if (b.dataset.act && b.tagName !== "SELECT") act(b.dataset.act, b);
  });
  document.getElementById("prevB").onclick = () => { step = Math.max(0, step - 1); render(); window.scrollTo(0, 0); };
  document.getElementById("nextB").onclick = () => { step = Math.min(STEPS.length - 1, step + 1); render(); window.scrollTo(0, 0); };
  document.getElementById("btnImport").onclick = () => document.getElementById("importFile").click();
  document.getElementById("btnExport").onclick = exportJSON;
  refreshSaves(); render();
}
window.MutagenBuilder = { derive, randomChar, fromExample, estimateScrip, blank, get state() { return S; }, set state(v) { S = normalize(v); render(); }, goto(i) { step = i; render(); }, render };
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();

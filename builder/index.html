<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutagen Character Builder</title>
<link rel="icon" href="data:,">
<!-- Mutagen Character Builder. Single self-contained file: no CDNs, no build step.
     Works from file:// and GitHub Pages. GAME DATA is the first <script> block below:
     update it when the rules in chapters/02-08 change. App code follows it. -->
<style>
:root{--bg:#0d1110;--pan:#161c1a;--pan2:#1e2623;--ink:#dfe8e2;--dim:#8fa39a;--acid:#b6ff2e;--acid2:#4cc300;--chrome:#62d7ff;--bio:#8cff6a;--splice:#ff5fd2;--bad:#ff5a5a;--warn:#ffc23d;--line:#2c3833}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
a{color:var(--acid)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#0d1110 0%,rgba(13,17,16,.92) 60%,rgba(13,17,16,.75)),url(../art/cover.jpg) center/cover;border-bottom:2px solid var(--acid2);padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{margin:0 12px 0 0;font-size:22px;letter-spacing:4px;color:var(--acid);text-shadow:0 0 8px rgba(182,255,46,.5)}
header h1 small{font-size:11px;letter-spacing:1px;color:var(--dim);display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--pan2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer}button:hover:not(:disabled){border-color:var(--acid)}button:disabled{opacity:.4;cursor:not-allowed}
.btn.pri,#btnRandom{background:var(--acid2);color:#061;font-weight:700;border-color:var(--acid)}
input,textarea{width:100%}input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--acid2)}
label{display:block;margin:6px 0;color:var(--dim)}label input,label select,label textarea{margin-top:2px;color:var(--ink)}
label.inl{display:inline-flex;gap:6px;align-items:center}
#steps{display:flex;flex-wrap:wrap;gap:4px;padding:8px 14px;background:var(--pan);border-bottom:1px solid var(--line)}
.stp{font-size:13px;background:transparent}.stp b{display:inline-block;width:20px;height:20px;line-height:20px;border-radius:50%;background:var(--line);text-align:center;font-size:12px}
.stchip{display:none;margin-left:auto}.stchip.ok b{background:var(--acid2);color:#061}.stchip.no b{background:var(--bad);color:#200}.stp.on{border-color:var(--acid);color:var(--acid)}.stp.on b{background:var(--acid2);color:#061}.stp.bad b{background:var(--bad);color:#200}.stp.warn b{background:var(--warn);color:#320}
main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;padding:14px;max-width:1300px;margin:auto}
#panel{background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
#panel h2{margin:0 0 6px;color:var(--acid);letter-spacing:1px}#panel h3{color:var(--acid);margin:16px 0 4px;font-size:16px}
aside{position:sticky;top:120px;align-self:start;background:var(--pan);border:1px solid var(--line);border-radius:10px;padding:12px}
aside h3{margin:0;color:var(--acid)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}.nums div{background:var(--pan2);border-radius:6px;padding:4px;text-align:center}.nums span{display:block;font-size:10px;color:var(--dim);text-transform:uppercase}.nums b{font-size:18px}
.mini,.small{font-size:12.5px;color:var(--dim)}.small b{color:var(--ink)}
.status{margin:8px 0 4px;padding:6px;border-radius:6px;font-weight:700;text-align:center}.status.ok{background:rgba(76,195,0,.2);color:var(--acid)}.status.no{background:rgba(255,90,90,.15);color:var(--bad)}
.msgs{list-style:none;padding:0;margin:0;font-size:12.5px;max-height:40vh;overflow:auto}.msgs li{padding:3px 4px;border-bottom:1px solid var(--line);cursor:pointer}.msgs .e{color:#ff9a9a}.msgs .w{color:var(--warn)}
.hint{color:var(--dim);margin:2px 0 10px}.errc{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>label{flex:1 1 200px}.lbl{min-width:70px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:6px 0}
.card{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:8px;margin:0;color:var(--ink)}.card.on{border-color:var(--acid);box-shadow:0 0 0 1px var(--acid) inset}.card.badc{border-color:var(--bad)}.card select{width:auto}.tot{font-weight:700;color:var(--acid)}
.pickc{cursor:pointer}
.t{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}.t td,.t th{border:1px solid var(--line);padding:3px 6px;text-align:left}.t th{color:var(--dim)}.t tr.cur td{background:rgba(76,195,0,.15)}
.formbox{background:var(--pan2);border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px}
.form.bio{color:var(--bio)}.form.chrome{color:var(--chrome)}.form.splice{color:var(--splice)}
.trees{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.tree{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--pan2)}.tree.own{border-color:var(--acid2)}.tree.own.chrome{border-color:var(--chrome)}.tree.own.bio{border-color:var(--bio)}
.th{border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:4px}.th>b{font-size:17px;color:var(--acid)}
.formsel{display:flex;gap:10px;margin-top:4px}.formsel label{margin:0;display:inline-flex;gap:4px;align-items:center}.formsel .bio{color:var(--bio)}.formsel .chrome{color:var(--chrome)}.look{font-style:italic}
.node{display:block;margin:4px 0;padding:5px 6px;border-radius:6px;color:var(--ink);cursor:pointer}.node:hover{background:rgba(255,255,255,.03)}.node.on{background:rgba(76,195,0,.14)}.node.dis{opacity:.5;cursor:not-allowed}
.tierh{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:8px 0 2px;border-bottom:1px solid rgba(255,255,255,.08)}
.node.evo{border:1px dashed var(--acid2);cursor:default}.node.evo.on{background:rgba(76,195,0,.2)}
.tag.role{background:var(--acid2);color:#000;border-color:var(--acid2)}
.slot.sig{border-left:3px solid var(--acid)}
.formbox.mig{border-color:#d90;color:#fc6}
.tag{font-size:10.5px;border:1px solid var(--acid2);color:var(--acid);border-radius:4px;padding:0 4px}.tag.no{border-color:var(--dim);color:var(--dim)}
.slot{border:1px solid var(--line);background:var(--pan2);border-radius:8px;padding:8px;margin:6px 0}.slot.wild{border-style:dashed;color:var(--dim)}.slot.bads{border-color:var(--bad)}
.slot .row input{flex:1 1 150px;width:auto}.slot select{flex:0 1 auto}.num{font-size:18px;color:var(--acid);width:24px}.flux{font-weight:700;color:var(--splice);white-space:nowrap}
.ib{padding:2px 7px}.tw{display:flex;flex-wrap:wrap;gap:4px 10px;margin:6px 0 2px}.tw label{margin:0;display:inline-flex;gap:3px;align-items:center;font-size:13px;color:var(--ink)}.tw label.dis{opacity:.4}.tw .smp{color:var(--warn)}
.line{color:#cfe6d8}.err{color:#ff9a9a}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.items label{margin:0;font-size:13px;color:var(--ink)}.items input{width:70px}
details{margin-top:10px}summary{cursor:pointer;color:var(--acid)}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.sheetwrap{background:#fff;color:#111;border-radius:6px;padding:10px;overflow:auto}
/* Character sheet (matches sheets/Character_Sheet.html) */
.sheet{font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#111;max-width:7.7in;margin:auto;background:#fff}
.sheet h1{font-size:22px;margin:0 0 4px;letter-spacing:3px;border-bottom:3px solid #4c0;padding-bottom:2px;color:#111}
.sheet h2{font-size:12px;background:#222;color:#bf0;padding:2px 6px;margin:8px 0 3px;text-transform:uppercase;letter-spacing:1px}
.sheet table{width:100%;border-collapse:collapse}.sheet td,.sheet th{border:1px solid #555;padding:3px 4px;vertical-align:top;text-align:left}.sheet th{background:#eee;font-size:10px}
.sheet b,.sheet .small b{color:#111}.sheet i{color:#333}
.sheet .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sheet .small{font-size:10px;color:#222}.sheet small{color:#555}.sheet tr.off td{background:#f3f3f3;color:#bbb}
.sheet .bx{display:inline-block;width:11px;height:11px;border:1px solid #333;margin-right:2px;vertical-align:middle}.sheet .feats{margin:2px 0;padding-left:16px}.sheet p{margin:2px 0}
#printArea{display:none}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px}
aside h3,.card,.node,.slot .line,.msgs button,.sheet td,.sheet p,.formbox{overflow-wrap:anywhere}
.intro{background:var(--pan2);border-left:3px solid var(--acid2);padding:8px 10px;border-radius:6px;font-size:14px}
.msgs li button{all:unset;display:block;width:100%;cursor:pointer;padding:1px 0}.msgs li button:focus-visible{outline:2px solid var(--acid)}
.btn.trim{width:100%;margin:4px 0;border-color:var(--warn);color:var(--warn)}
#saveNote{color:var(--warn);font-size:12px}
.sheet h2 small{color:#cfd8d3}
select{max-width:100%}.tscroll{overflow-x:auto;max-width:100%}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:860px){header{position:static}main{grid-template-columns:minmax(0,1fr)}aside{position:static}.stchip{display:inline-flex!important}.nums{grid-template-columns:repeat(4,1fr)}header h1{font-size:18px}.msgs{max-height:none}}
@media print{@page{size:letter;margin:.35in}body{background:#fff}.sheet{font-size:9.5px;max-width:none}.sheet td,.sheet th{padding:1px 3px}.sheet h1{font-size:18px}.sheet h2{font-size:10.5px;margin:5px 0 2px;padding:1px 5px}.sheet .small{font-size:9px}.sheet tr.off td{padding:0 3px;font-size:8px}#app{display:none!important}#printArea{display:block!important}.sheet h2{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div id="app">
<header><h1>MUTAGEN<small>Character Builder · v0.2</small></h1>
<div class="tools">
<select id="lvlTop" aria-label="Character level"></select>
<button id="btnRandom" title="Random legal character at this level">⚄ Random</button>
<select id="exSel" aria-label="Load example"><option value="">Example…</option></select>
<button id="btnNew">New</button><button id="btnSave">Save</button><select id="loadSel" aria-label="Load saved"></select>
<button id="btnExport" title="Download this character as a .json file">Export</button><button id="btnImport" title="Load a character from an exported .json file">Import</button><button id="btnLink" title="Copy a link that opens this character (the whole sheet is packed into the link; nothing is uploaded)">Link</button><input type="file" id="importFile" accept=".json,application/json" hidden aria-label="Import character file"><span id="saveNote" role="status"></span><a href="../arcade/index.html" title="Gauntlet mode: run a party of saved characters through ten levels of fights">▶ Arcade</a>
</div></header>
<nav id="steps"></nav>
<main><section><div id="panel"></div><div class="nav"><button id="prevB">← Back</button><button id="nextB" class="btn pri">Next →</button></div></section><aside id="summary"></aside></main>
</div>
<div id="printArea"></div>
<script>
/* =====================================================================
   MUTAGEN GAME DATA  (edit here when the rules change)
   Source of truth: chapters/02-08 (+02A, 03_Trees/*). Keep ids stable (saved characters use them).
   Text tokens in node text: {R}=Rank, {2R}=2xRank, {R1}=Rank+1,
   {GUM}=Gumption, {GRIT}=Grit, {ADR}=2xRank+Grit. fx keys are read by derive() in the app code:
     armor, armorRank3 (Plating), armorMax, hpPerLevel, speed, reach, mendFree, burstDie,
     rangedDouble, critRanged, critWiden, meleeDie / anyDie (bonus die note), rend, reactions, attack:{...}
   Node tiers: 0 Root, 1 Tier I, 2 Tier II, 3 Apex. Evolution nodes: evo: 4|7, form: <form id>.
   ===================================================================== */
const MUTAGEN = {
  version: "0.2.0",
  // Stat values by stage, in order: primary, secondary, tertiary, dump (+0), dump (-1)
  stages: [
    { id: "base", name: "Base", from: 1, vals: [3, 2, 1, 0, -1] },
    { id: "evo1", name: "Evolution I", from: 4, vals: [5, 3, 2, 1, 0] },
    { id: "evo2", name: "Evolution II", from: 7, vals: [8, 4, 3, 2, 1] }
  ],
  finalFormBonus: 2,
  stats: [
    { id: "grit", name: "Grit", tag: "I'm still standing.", does: "Power melee, lifting, Endure, Max HP" },
    { id: "moxie", name: "Moxie", tag: "Watch this.", does: "Finesse melee, sneaking, Dodge, initiative" },
    { id: "nerve", name: "Nerve", tag: "Breathe. Aim.", does: "Ranged attacks, noticing, Resist, Flux Limit" },
    { id: "gumption", name: "Gumption", tag: "Hand me that wrench.", does: "Tech, medicine, hacking, Patch, Analyze, Spit" },
    { id: "chutzpah", name: "Chutzpah", tag: "You and what army?", does: "Talk, lie, Taunt, Rally, Mind Spike, Dread" }
  ],
  // Per level (index 0 = level 1). Wild slots = die - surges known. sigs = Signature Surges.
  levels: [
    { lv: 1, rank: 1, surges: 3, die: 4, prime: 2, sigs: 0, extra: "3 Knacks" },
    { lv: 2, rank: 1, surges: 4, die: 6, prime: 2, sigs: 0, extra: "" },
    { lv: 3, rank: 2, surges: 5, die: 6, prime: 2, sigs: 0, extra: "+1 Knack" },
    { lv: 4, rank: 2, surges: 6, die: 8, prime: 3, sigs: 1, extra: "EVOLUTION I; Tier II opens" },
    { lv: 5, rank: 3, surges: 7, die: 8, prime: 3, sigs: 1, extra: "2 Twists per Surge; Plating +2" },
    { lv: 6, rank: 3, surges: 8, die: 8, prime: 3, sigs: 1, extra: "+1 Knack" },
    { lv: 7, rank: 4, surges: 9, die: 12, prime: 4, sigs: 2, extra: "EVOLUTION II; Apex opens" },
    { lv: 8, rank: 4, surges: 10, die: 12, prime: 4, sigs: 2, extra: "Primary tree full" },
    { lv: 9, rank: 5, surges: 11, die: 12, prime: 4, sigs: 2, extra: "+1 Knack; primary pick overflows" },
    { lv: 10, rank: 5, surges: 12, die: 12, prime: 4, sigs: 2, extra: "FINAL FORM" }
  ],
  knackLevels: { 1: 3, 3: 1, 6: 1, 9: 1 }, // Knacks gained at that level
  tier2Level: 4, tier2Needs: 3, apexLevel: 7, apexNeeds: 6, treeSize: 10,
  baseHP: 12, hpPerGrit: 2, hpPerLevel: 5,
  baseSpeed: 30, armorMax: 4, fluxBase: 4, fluxMin: 4, spliceFlux: -1,
  startScrip: 50, upkeepPerChrome: 25, juiceStart: 1, juiceMax: 3,
  missionPay: lv => 200 + 100 * lv,
  finalForm: "Once per Lockdown, at the start of a combat (after Priming): until it ends, primary stat +2, Prime two extra Surges, and every Surge you Unleash is Amped (Signatures too).",
  emergence: "In the first combat after Evolving, at the start of your first turn: describe the change, gain temporary HP = 2 x level, every enemy within 30 ft that sees you is Shaken (not Bosses), and your new Signature Surge is Amped the first time you Unleash it.",
  signatureRule: "Always Primed at the start of combat; Primed again at the start of your next turn after you Unleash it (once per round). Normal Flux. Not on the Sequence; doesn't count toward Surges known, Prime, or the Primed maximum.",
  // A Surge may use its Shape's stat or the stat of the tree that unlocked its Effect.
  treeStats: { hide: ["grit"], limbs: ["grit", "moxie"], senses: ["nerve"], glands: ["gumption"], wiring: ["moxie"], mind: ["chutzpah"] },

  forms: [
    { id: "juggernaut", name: "Juggernaut", quote: "I don't move. You do.", primary: "grit", secondary: "nerve", tertiary: "chutzpah", dumps: ["moxie", "gumption"], trees: ["hide", "limbs", "glands"], evo: { 4: "siegehide", 7: "fortress" },
      blurb: "Unkillable. Holds doorways, Taunts, intercepts, and takes the hit meant for a friend.",
      stages: [
        { name: "Juggernaut", bio: "Thick neck, heavy brow, knuckles armoured with horn. Your skin has the give of a car tyre.", chrome: "Subdermal plates you can feel through your shirt; a spine brace that whines when you stand." },
        { name: "Rampart", bio: "You grow a foot in a night. Your back splits into overlapping bone slabs; your forearms swell into shields.", chrome: "Bulkhead plates bolt over shoulders and chest; your joints are hydraulic now, and they hiss." },
        { name: "Colossus", bio: "Nine feet of keratin and scar tissue. Horns, a domed skull, a heartbeat people feel through the floor.", chrome: "A walking bunker: riveted armour, a face behind a visor slit, treads of steel on your soles." },
        { name: "Citadel", bio: "Stone-hard ridges, moss in the cracks, small things nesting in you. You are a place.", chrome: "Siren lights, warning stencils, a hatch in your chest. Ostrander would classify you as infrastructure." } ] },
    { id: "skitter", name: "Skitter", quote: "You blinked. I was already there.", primary: "moxie", secondary: "gumption", tertiary: "grit", dumps: ["nerve", "chutzpah"], trees: ["wiring", "limbs", "senses"], evo: { 4: "mantisreflex", 7: "lightningstep" },
      blurb: "The fastest thing in any room: darts in, Dazes, darts out, and acts more often than anyone.",
      stages: [
        { name: "Skitter", bio: "Long limbs, twitchy hands, pupils that never settle; you're warm to the touch.", chrome: "Reflex jacks at the base of the skull; fingertips with steel contacts that spark when you're nervous." },
        { name: "Mantis", bio: "Your forearms fold into barbed hooks; your knees bend backwards; you smell like ozone.", chrome: "Synthetic muscle cables under translucent skin, and a capacitor hump between your shoulders." },
        { name: "Wraith", bio: "Glassy wing-cases that hum, faceted eyes, lightning crawling along your veins.", chrome: "You blur when you move; a plasma coil glows through your ribs; you leave scorch-prints." },
        { name: "Livewire", bio: "Barely solid: a figure of arcs and chitin that's always slightly somewhere else.", chrome: "A human-shaped storm in a chrome cage, held together by a magnetic field." } ] },
    { id: "oracle", name: "Oracle", quote: "I saw you coming. Three days ago.", primary: "nerve", secondary: "chutzpah", tertiary: "moxie", dumps: ["grit", "gumption"], trees: ["senses", "mind", "wiring"], evo: { 4: "foresight", 7: "thousandeyes" },
      blurb: "Sees everything, steadies everyone, holds the most Flux. Fragile body, deadly aim.",
      stages: [
        { name: "Oracle", bio: "Pale, still, unsettling eyes with too much iris; you hear heartbeats through walls.", chrome: "A monocle lens grafted to the socket; tiny antennae behind the ears." },
        { name: "Argus", bio: "A third eye opens on your brow; small eyes bead along your collarbones and blink out of time.", chrome: "A ring of lenses around your head like a crown; your voice comes with a faint radio hiss." },
        { name: "Seraph", bio: "Wing-like membranes covered in eyes unfold from your back; you float a hand's width off the floor.", chrome: "Six optic arms fan out from your spine; holographic targeting halos hang around you." },
        { name: "Panopticon", bio: "A tall white shape of lids and lashes; when you look at someone, they feel seen.", chrome: "A tower of lenses and dishes; every camera in the district turns toward you." } ] },
    { id: "alembic", name: "Alembic", quote: "Hold still. This will either cure you or kill it.", primary: "gumption", secondary: "grit", tertiary: "nerve", dumps: ["moxie", "chutzpah"], trees: ["glands", "hide", "mind"], evo: { 4: "transmute", 7: "panacea" },
      blurb: "A walking laboratory: heals, poisons, survives toxic air, and keeps the crew alive.",
      stages: [
        { name: "Alembic", bio: "Glands swelling at the throat and wrists; you sweat something sweet-smelling and faintly green.", chrome: "Injector ports along your forearms, and a hip-mounted reservoir with a gauge." },
        { name: "Still", bio: "Translucent sacs bloom across your back, glowing with what you're brewing; your breath fogs.", chrome: "Coiled tubing and glass vials under a ribcage of chrome; you gurgle when you walk." },
        { name: "Bloomheart", bio: "Spore-fronds and flower-like vents open along your spine; insects follow you.", chrome: "A walking refinery: pressurised tanks, nozzle arrays, a warning placard that reads FLAMMABLE." },
        { name: "Wellspring", bio: "A living garden: roots in the floor where you stand, fruit that heals, pollen that kills.", chrome: "A mobile clinic: hissing pipes, a dozen spigots, steam that smells like hospitals." } ] },
    { id: "siren", name: "Siren", quote: "Everybody look at me.", primary: "chutzpah", secondary: "moxie", tertiary: "gumption", dumps: ["grit", "nerve"], trees: ["mind", "wiring", "limbs"], evo: { 4: "sirensong", 7: "crownofwill" },
      blurb: "Impossible to ignore: talks past guards, Taunts whole rooms, bends minds. Reckless; first to Overload.",
      stages: [
        { name: "Siren", bio: "Striking face, a voice with a second note under it, a scent people remember.", chrome: "Voice modulator at the throat; LED tattoos that pulse when you talk." },
        { name: "Diva", bio: "Iridescent skin, a frill of feathers or fins at the neck; your voice harmonises with itself.", chrome: "Speaker grilles bloom along your collarbones; your face projects a light-show halo." },
        { name: "Choir", bio: "A crown of soft horns; a dozen mouths open along your arms and sing in chorus.", chrome: "An antenna crown and a cape of fibre-optic cable; you broadcast on every frequency." },
        { name: "Crowned", bio: "Too beautiful to look at directly; people weep, kneel or flee.", chrome: "A living billboard and a broadcast tower; your face is on every screen, saying your name." } ] }
  ],
  origins: [
    { id: "spillborn", name: "Spill-Born", blurb: "Raised in the flooded Wards.", knack: "Scavenging", perk: "Advantage on Endure against poison, disease, and anything that adds Flux to you." },
    { id: "washout", name: "Corporate Washout", blurb: "Ex-Ostrander staff, fired or fled.", knack: "Corporate Protocol", perk: "Start with +100 Scrip. Once per mission, name an old contact who can open one door.", scrip: 100 },
    { id: "escapee", name: "Lab Escapee", blurb: "You were the experiment.", knack: "Lab Science", perk: "You know one extra Surge at every level (it fills a Wild slot; never adds a Signature).", extraSurge: 1 },
    { id: "clinicrat", name: "Clinic Rat", blurb: "A street surgeon raised you, or still owns you.", knack: "Street Medicine", perk: "Your Patch action heals +Rank extra HP; removing Scars or Faults costs you half.", patchBonus: true },
    { id: "militia", name: "Ward Militia", blurb: "You held the barricades.", knack: "Squad Tactics", perk: "+2 to your roll in group initiative checks. Once per combat, take Brace as a Quick action." },
